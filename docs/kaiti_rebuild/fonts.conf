<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- 仅供 LibreOffice 导出使用（经 FONTCONFIG_FILE 生效），不修改系统或用户字体配置。
     宋体/黑体为商业字体，改用 Fandol（GB 字形，标点居左下，取自 Ubuntu texlive-lang-chinese）：
     宋体 → FandolSong，黑体 → FandolHei。
     华文新魏：2026-10-26 起使用用户提供的原版字体文件（STXinwei，常州华文，fsType=8 允许嵌入），
     放在 /tmp/lo_fonts/xinwei；此前用 FandolKai（楷体）替代，指导教师指出封面标题显示为楷体。
     Fandol 的纵向度量已改为宋体的值（ascent 0.859、descent 0.141、无额外行距），字形未改。
     Times New Roman 为微软核心字体原版（times32.exe，哈希与 Debian 一致）。
     2026-10-26 起弃用 AR PL UMing：其“。、”居中（台湾标点规范）。 -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/tmp/lo_fonts/ttf</dir>
  <dir>/tmp/lo_fonts/fandol_m</dir>
  <dir>/tmp/lo_fonts/xinwei</dir>
  <cachedir>/tmp/lo_fonts/cache</cachedir>
  <match target="pattern"><test name="family"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FandolSong</string></edit></match>
  <match target="pattern"><test name="family"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FandolSong</string></edit></match>
  <match target="pattern"><test name="family"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FandolHei</string></edit></match>
  <match target="pattern"><test name="family"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FandolHei</string></edit></match>
</fontconfig>
