<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- 仅供预览 PPT（LibreOffice 渲染）：在论文字体配置基础上把 微软雅黑 映射到 FandolHei -->
<fontconfig>
  <include>/home/CNS2026014739/Projects/Diffusion_model/Graduate_Design/tools/libreoffice/fonts/fonts.conf</include>
  <match target="pattern"><test name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FandolHei</string></edit></match>
  <match target="pattern"><test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>FandolHei</string></edit></match>
</fontconfig>
